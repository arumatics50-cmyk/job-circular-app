name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Root Structure
        run: |
          if [ -d "job-circular-app" ] && [ ! -f "pubspec.yaml" ]; then
            echo "Moving files from subfolder..."
            cp -r job-circular-app/* .
          fi
          ls -la

      - name: Generate Android Project
        run: |
          flutter create . --platforms=android --org com.jobcircular.app
          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: job-circular-app-apk
          path: build/app/outputs/flutter-apk/*.apk
