name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Normalize Project Root
        run: |
          if [ -d "job-circular-app" ] && [ ! -f "pubspec.yaml" ]; then
            echo "Moving files from subfolder to root..."
            mv job-circular-app/* . || true
          fi
          ls -la

      - name: Generate Android Platform
        run: |
          flutter create . --platforms=android --org com.jobcircular.app
          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-circular-apk
          path: build/app/outputs/**/app-*.apk
          if-no-files-found: error
