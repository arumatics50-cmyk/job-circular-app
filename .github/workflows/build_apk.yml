name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Workspace & Project Files
        run: |
          # If uploaded inside subfolder job-circular-app, copy everything to root
          if [ -d "job-circular-app" ]; then
            echo "Moving files from subfolder..."
            cp -rf job-circular-app/* . || true
          fi

          # Clean pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: job_circular_app
          description: "Bangladesh Job Circular App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            google_fonts: ^6.2.1
            intl: ^0.19.0
            url_launcher: ^6.3.0
            share_plus: ^10.0.0
            shared_preferences: ^2.3.0

          flutter:
            uses-material-design: true
          EOF

          # Replace image_viewer_screen with native InteractiveViewer
          mkdir -p lib/screens
          cat << 'EOF' > lib/screens/image_viewer_screen.dart
          import 'package:flutter/material.dart';
          import 'package:share_plus/share_plus.dart';

          class ImageViewerScreen extends StatelessWidget {
            final String imageUrl;
            final String title;

            const ImageViewerScreen({
              Key? key,
              required this.imageUrl,
              required this.title,
            }) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black.withOpacity(0.85),
                  iconTheme: const IconThemeData(color: Colors.white),
                  title: Text(title, style: const TextStyle(color: Colors.white, fontSize: 16)),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.share),
                      onPressed: () => Share.share('অফিসিয়াল সার্কুলার: $imageUrl'),
                    ),
                  ],
                ),
                body: Center(
                  child: InteractiveViewer(
                    panEnabled: true,
                    minScale: 0.5,
                    maxScale: 4.0,
                    child: Image.network(imageUrl, fit: BoxFit.contain),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Generate Android Platform
        run: |
          flutter create --project-name job_circular_app --platforms=android .
          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-circular-app-apk
          path: build/app/outputs/flutter-apk/*.apk
