name: job_circular_app
description: "Bangladesh Job Circular App - Govt & Bank Jobs, Exam Dates & Admit Card Alerts"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  photo_view: ^0.15.0
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
